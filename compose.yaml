services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
      - path: ./backend/.env
        required: false
    environment:
      APP_URL: http://localhost:8001
      DB_DATABASE: /data/database.sqlite
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - finance-data:/data
      - uploads:/app/storage/app/public
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env.example
      - path: ./frontend/.env
        required: false
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8001
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  finance-data:
  uploads:
